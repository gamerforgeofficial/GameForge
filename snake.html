<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameForge - Snake</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    width: 95%;
    max-width: 500px;
    margin: 30px auto;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 20px;
}

.info {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 15px;
}

.info div {
    background: #15151f;
    padding: 12px 25px;
    border-radius: 10px;
}

canvas {
    width: min(90vw, 400px);
    height: min(90vw, 400px);
    background: #111118;
    border: 4px solid #6c2cff;
    display: block;
    margin: auto;
}

button {
    border: none;
    background: #6c2cff;
    color: white;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #8b5cff;
}

#start {
    margin-top: 18px;
}

.controls {
    width: 190px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}

.controls button {
    padding: 12px;
    font-size: 20px;
}

.empty {
    visibility: hidden;
}

#message {
    color: #ccc;
    min-height: 25px;
}

.back {
    display: inline-block;
    margin-top: 10px;
    color: #aaa;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<h1>🐍 Snake</h1>

<div class="subtitle">
GameForge Mini Game
</div>

<div class="info">
    <div>
        Score: <b id="score">0</b>
    </div>

    <div>
        Best: <b id="best">0</b>
    </div>
</div>

<canvas id="canvas" width="400" height="400"></canvas>

<button id="start">Start Game</button>

<div class="controls">

    <button class="empty"></button>
    <button onclick="setDirection('up')">⬆️</button>
    <button class="empty"></button>

    <button onclick="setDirection('left')">⬅️</button>
    <button onclick="setDirection('down')">⬇️</button>
    <button onclick="setDirection('right')">➡️</button>

</div>

<p id="message">
Press Start Game
</p>

<a class="back" href="games.html">
← Back to Games
</a>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");
const startButton = document.getElementById("start");
const message = document.getElementById("message");

const size = 20;
const cell = 20;

let snake = [];
let food = {};

let direction = "right";
let nextDirection = "right";

let score = 0;
let best = Number(localStorage.getItem("snakeBest")) || 0;

let gameRunning = false;
let timer = null;

bestElement.textContent = best;


/* START GAME */

function startGame() {

    clearInterval(timer);

    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = "right";
    nextDirection = "right";

    score = 0;

    scoreElement.textContent = score;

    gameRunning = true;

    message.textContent = "Use Arrow Keys or buttons";

    startButton.textContent = "Restart Game";

    createFood();

    draw();

    timer = setInterval(gameUpdate, 120);
}


/* CREATE FOOD */

function createFood() {

    do {

        food = {
            x: Math.floor(Math.random() * size),
            y: Math.floor(Math.random() * size)
        };

    } while (
        snake.some(part =>
            part.x === food.x &&
            part.y === food.y
        )
    );
}


/* GAME UPDATE */

function gameUpdate() {

    direction = nextDirection;

    let head = {
        x: snake[0].x,
        y: snake[0].y
    };


    if (direction === "up") {
        head.y--;
    }

    if (direction === "down") {
        head.y++;
    }

    if (direction === "left") {
        head.x--;
    }

    if (direction === "right") {
        head.x++;
    }


    /* WALL COLLISION */

    if (
        head.x < 0 ||
        head.x >= size ||
        head.y < 0 ||
        head.y >= size
    ) {
        endGame();
        return;
    }


    /* BODY COLLISION */

    if (
        snake.some(part =>
            part.x === head.x &&
            part.y === head.y
        )
    ) {
        endGame();
        return;
    }


    snake.unshift(head);


    /* FOOD */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        scoreElement.textContent = score;

        if (score > best) {

            best = score;

            bestElement.textContent = best;

            localStorage.setItem(
                "snakeBest",
                best
            );
        }

        createFood();

    } else {

        snake.pop();

    }

    draw();
}


/* DRAW */

function draw() {

    ctx.fillStyle = "#111118";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* FOOD */

    ctx.fillStyle = "#ef4444";

    ctx.beginPath();

    ctx.arc(
        food.x * cell + 10,
        food.y * cell + 10,
        8,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* SNAKE */

    snake.forEach((part, index) => {

        if (index === 0) {
            ctx.fillStyle = "#a78bfa";
        } else {
            ctx.fillStyle = "#6c2cff";
        }

        ctx.fillRect(
            part.x * cell + 1,
            part.y * cell + 1,
            18,
            18
        );

    });
}


/* DIRECTION */

function setDirection(newDirection) {

    if (!gameRunning) {
        return;
    }


    if (
        newDirection === "up" &&
        direction !== "down"
    ) {
        nextDirection = "up";
    }


    if (
        newDirection === "down" &&
        direction !== "up"
    ) {
        nextDirection = "down";
    }


    if (
        newDirection === "left" &&
        direction !== "right"
    ) {
        nextDirection = "left";
    }


    if (
        newDirection === "right" &&
        direction !== "left"
    ) {
        nextDirection = "right";
    }
}


/* KEYBOARD */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") {
        setDirection("up");
    }

    if (event.key === "ArrowDown") {
        setDirection("down");
    }

    if (event.key === "ArrowLeft") {
        setDirection("left");
    }

    if (event.key === "ArrowRight") {
        setDirection("right");
    }

});


/* GAME OVER */

function endGame() {

    gameRunning = false;

    clearInterval(timer);

    message.textContent =
        "💥 Game Over! Score: " + score;

    startButton.textContent = "Play Again";
}


/* BUTTON */

startButton.addEventListener(
    "click",
    startGame
);

</script>

</body>
</html>
