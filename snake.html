<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b14">
<meta name="description" content="Snake with four difficulty levels, obstacles and bonus food. A GameForge mini game.">
<title>Snake | GameForge</title>

<style>
:root {
    --bg: #0c0b14;
    --panel: #161425;
    --border: #2b2745;
    --text: #f3f1ff;
    --muted: #9a94bd;
    --accent: #7c4dff;
    --accent-2: #5b34d6;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #231b4d 0%, var(--bg) 55%) fixed;
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
}

.app { width: min(100%, 460px); margin: 0 auto; text-align: center; }
h1 { margin: 0; font-size: clamp(1.8rem, 7vw, 2.4rem); }
.subtitle { margin: 4px 0 14px; color: var(--muted); }

.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.level {
    appearance: none;
    padding: 9px 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--muted);
    font: inherit;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
}
.level:hover { color: var(--text); }
.level[aria-pressed="true"] { background: linear-gradient(145deg, var(--accent), var(--accent-2)); border-color: var(--accent); color: #fff; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.stat { padding: 8px 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
.stat span { display: block; color: var(--muted); font-size: .7rem; }
.stat b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }

.stage {
    position: relative;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: linear-gradient(145deg, #1b1830, #11101d);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .55);
}
canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; border-radius: 10px; touch-action: none; }

.overlay {
    position: absolute;
    inset: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 20px;
    border-radius: 10px;
    background: rgba(12, 11, 20, .82);
    backdrop-filter: blur(3px);
}
.overlay[hidden] { display: none; }
.overlay h2 { margin: 0; font-size: 1.6rem; }
.overlay p { margin: 0; color: var(--muted); line-height: 1.6; }
.overlay .record { color: #ffd166; font-weight: 700; }

.btn {
    appearance: none;
    padding: 11px 26px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(124, 77, 255, .35);
    transition: transform .15s ease, filter .15s ease;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.12); }
.btn.ghost { background: var(--panel); border: 1px solid var(--border); box-shadow: none; padding: 9px 14px; }
.btn:focus-visible, .level:focus-visible, .back:focus-visible, .pad button:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }

.tools { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }

.pad { width: 190px; margin: 14px auto 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pad button {
    appearance: none;
    padding: 12px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
}
.pad button:active { background: #221d3d; }
.pad .gap { visibility: hidden; }

.hint { min-height: 1.5em; margin: 12px 0 6px; color: var(--muted); font-size: .9rem; }
.back { color: var(--muted); text-decoration: none; }
.back:hover { color: var(--text); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<body>
<main class="app">

    <h1>🐍 Snake</h1>
    <p class="subtitle">GameForge mini game</p>

    <div class="levels" id="levels" role="group" aria-label="Difficulty"></div>

    <section class="stats" aria-label="Game stats">
        <div class="stat"><span>Score</span><b id="score">0</b></div>
        <div class="stat"><span>Best</span><b id="best">0</b></div>
        <div class="stat"><span>Level</span><b id="level">1</b></div>
    </section>

    <div class="stage">
        <canvas id="canvas" aria-label="Snake game board" role="img"></canvas>
        <div class="overlay" id="overlay">
            <h2 id="ovTitle">Snake</h2>
            <p id="ovText"></p>
            <button class="btn" id="startBtn" type="button">Start game</button>
        </div>
    </div>

    <div class="tools">
        <button class="btn ghost" id="pauseBtn" type="button" aria-label="Pause game">⏸ Pause</button>
        <button class="btn ghost" id="soundBtn" type="button" aria-pressed="true" aria-label="Toggle sound">🔊</button>
    </div>

    <div class="pad" aria-label="Direction controls">
        <span class="gap"></span><button type="button" data-dir="up" aria-label="Up">⬆️</button><span class="gap"></span>
        <button type="button" data-dir="left" aria-label="Left">⬅️</button>
        <button type="button" data-dir="down" aria-label="Down">⬇️</button>
        <button type="button" data-dir="right" aria-label="Right">➡️</button>
    </div>

    <p class="hint" id="message" role="status" aria-live="polite"></p>
    <a class="back" href="games.html">← Back to games</a>

</main>

<script>
(() => {
    "use strict";

    /* ---------- Config ---------- */
    const N = 20, CELL = 20, SIZE = N * CELL;
    const DIFFS = {
        easy:   { name: "Easy",   base: 150, min: 95, ramp: 1.5, wrap: true,  obstacles: false, text: "Walls wrap around. Relax and grow." },
        normal: { name: "Normal", base: 120, min: 70, ramp: 2,   wrap: false, obstacles: false, text: "Walls are deadly. Speed rises as you eat." },
        hard:   { name: "Hard",   base: 100, min: 55, ramp: 2,   wrap: false, obstacles: true,  text: "Deadly walls, and stones appear as you grow." },
        insane: { name: "Insane", base: 80,  min: 40, ramp: 1.5, wrap: false, obstacles: true,  text: "Blistering speed, stones everywhere." }
    };
    const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
    const OPP = { up: "down", down: "up", left: "right", right: "left" };
    const BONUS_POINTS = 5, BONUS_LIFETIME = 6000, MAX_OBSTACLES = 14;

    /* ---------- DOM ---------- */
    const $ = id => document.getElementById(id);
    const canvas = $("canvas"), ctx = canvas.getContext("2d");
    const overlay = $("overlay"), ovTitle = $("ovTitle"), ovText = $("ovText");
    const startBtn = $("startBtn"), pauseBtn = $("pauseBtn"), soundBtn = $("soundBtn");
    const scoreEl = $("score"), bestEl = $("best"), levelEl = $("level"), messageEl = $("message");

    /* ---------- Storage & sound ---------- */
    const store = {
        get(id) { try { return Number(localStorage.getItem("snakeBest-" + id)) || 0; } catch { return 0; } },
        set(id, v) { try { localStorage.setItem("snakeBest-" + id, String(v)); } catch { /* unavailable */ } }
    };
    const sound = {
        on: true, ctx: null,
        tone(freq, dur = 0.1, type = "square", vol = 0.05, slideTo = null) {
            if (!this.on) return;
            try {
                const a = this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
                const t = a.currentTime, osc = a.createOscillator(), g = a.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
                g.gain.setValueAtTime(vol, t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                osc.connect(g).connect(a.destination);
                osc.start(t);
                osc.stop(t + dur);
            } catch { /* audio unavailable */ }
        }
    };

    /* ---------- State ---------- */
    let diff = "normal";
    let snake = [], prev = [], dir = "right", queue = [];
    let food = null, bonus = null, obstacles = [];
    let score = 0, eaten = 0, best = store.get(diff);
    let status = "idle";      // idle | running | paused | over
    let acc = 0, lastT = 1, gameTime = 0, lastFrame = 0;
    const cfg = () => DIFFS[diff];
    const interval = () => Math.max(cfg().min, cfg().base - eaten * cfg().ramp);
    const level = () => Math.floor(eaten / 5) + 1;

    /* ---------- Canvas (sharp on HiDPI) ---------- */
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = SIZE * dpr;
    canvas.height = SIZE * dpr;

    /* ---------- Helpers ---------- */
    function randomFreeCell(minHeadDistance = 0) {
        const taken = new Set([...snake, ...obstacles, food, bonus].filter(Boolean).map(p => p.x + "," + p.y));
        const free = [];
        for (let y = 0; y < N; y++)
            for (let x = 0; x < N; x++) {
                if (taken.has(x + "," + y)) continue;
                if (minHeadDistance && Math.abs(x - snake[0].x) + Math.abs(y - snake[0].y) < minHeadDistance) continue;
                free.push({ x, y });
            }
        return free.length ? free[Math.floor(Math.random() * free.length)] : null;
    }

    function updateStats() {
        scoreEl.textContent = score;
        bestEl.textContent = best;
        levelEl.textContent = level();
    }

    function showOverlay(title, html, button) {
        ovTitle.textContent = title;
        ovText.innerHTML = html;
        startBtn.textContent = button;
        overlay.hidden = false;
        startBtn.focus({ preventScroll: true });
    }

    function renderLevels() {
        const box = $("levels");
        box.textContent = "";
        Object.entries(DIFFS).forEach(([id, d]) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "level";
            btn.textContent = d.name;
            btn.setAttribute("aria-pressed", String(id === diff));
            btn.addEventListener("click", () => { diff = id; best = store.get(diff); toIdle(); });
            box.appendChild(btn);
        });
    }

    /* ---------- Game flow ---------- */
    function toIdle() {
        status = "idle";
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        prev = snake.map(p => ({ ...p }));
        dir = "right"; queue = []; obstacles = []; bonus = null; food = null;
        score = 0; eaten = 0; acc = 0; lastT = 1;
        food = randomFreeCell();
        renderLevels();
        updateStats();
        pauseBtn.disabled = true;
        showOverlay("Snake", cfg().text + "<br>Arrow keys, WASD, swipe or the buttons to steer.", "Start game");
        messageEl.textContent = "Space or P pauses the game.";
    }

    function startGame() {
        if (status === "paused") return resume();
        const keepDiff = diff;
        toIdle();
        diff = keepDiff;
        status = "running";
        overlay.hidden = true;
        pauseBtn.disabled = false;
        pauseBtn.textContent = "⏸ Pause";
        messageEl.textContent = "";
    }

    function pause() {
        if (status !== "running") return;
        status = "paused";
        pauseBtn.textContent = "▶ Resume";
        showOverlay("Paused", "Press Space or P to continue.", "Resume");
    }

    function resume() {
        if (status !== "paused") return;
        status = "running";
        pauseBtn.textContent = "⏸ Pause";
        overlay.hidden = true;
    }

    function finish(title, reason) {
        status = "over";
        pauseBtn.disabled = true;
        sound.tone(220, 0.45, "sawtooth", 0.08, 70);
        const record = score > 0 && score >= best && score > (store.get(diff));
        if (record) { best = score; store.set(diff, best); }
        updateStats();
        showOverlay(title, `${reason}<br>Score: <b>${score}</b> &nbsp;|&nbsp; Best: <b>${best}</b>` +
            (record ? '<br><span class="record">🏆 New best score!</span>' : ""), "Play again");
    }

    function spawnFood() {
        food = randomFreeCell();
        if (!food) finish("🎉 You win!", "The whole board is filled.");
    }

    /* ---------- One game tick ---------- */
    function step() {
        if (queue.length) dir = queue.shift();
        const d = DIRS[dir];
        let hx = snake[0].x + d.x, hy = snake[0].y + d.y;

        if (cfg().wrap) { hx = (hx + N) % N; hy = (hy + N) % N; }
        else if (hx < 0 || hx >= N || hy < 0 || hy >= N) return finish("💥 Game over", "You hit the wall.");

        const ateFood = food && hx === food.x && hy === food.y;
        const ateBonus = bonus && hx === bonus.x && hy === bonus.y;
        const grow = ateFood || ateBonus;

        // the tail cell is free this tick unless we are growing
        const body = grow ? snake : snake.slice(0, -1);
        if (body.some(p => p.x === hx && p.y === hy)) return finish("💥 Game over", "You ran into yourself.");
        if (obstacles.some(p => p.x === hx && p.y === hy)) return finish("💥 Game over", "You hit a stone.");

        prev = snake.map(p => ({ ...p }));
        snake.unshift({ x: hx, y: hy });
        if (grow) prev.push({ ...prev[prev.length - 1] });
        else snake.pop();

        if (ateFood) {
            score += 1; eaten += 1;
            sound.tone(660, 0.08);
            spawnFood();
            if (status !== "running") return;
            if (eaten % 5 === 0 && !bonus) {
                const cell = randomFreeCell();
                if (cell) bonus = { ...cell, expires: gameTime + BONUS_LIFETIME };
            }
            if (cfg().obstacles && eaten % 3 === 0 && obstacles.length < MAX_OBSTACLES) {
                const stone = randomFreeCell(5);
                if (stone) obstacles.push(stone);
            }
        }
        if (ateBonus) {
            score += BONUS_POINTS;
            bonus = null;
            sound.tone(880, 0.25, "triangle", 0.07, 1320);
        }
        if (score > best) { best = score; store.set(diff, best); }
        updateStats();
    }

    /* ---------- Rendering ---------- */
    const lerp = (a, b, t) => a + (b - a) * t;

    function drawBoard() {
        for (let y = 0; y < N; y++)
            for (let x = 0; x < N; x++) {
                ctx.fillStyle = (x + y) % 2 ? "#14141f" : "#101019";
                ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
            }
        if (!cfg().wrap) {
            ctx.strokeStyle = "rgba(124, 77, 255, .55)";
            ctx.lineWidth = 3;
            ctx.strokeRect(1.5, 1.5, SIZE - 3, SIZE - 3);
        }
    }

    function drawObstacles() {
        obstacles.forEach(o => {
            const x = o.x * CELL + 1, y = o.y * CELL + 1, s = CELL - 2;
            const g = ctx.createLinearGradient(x, y, x + s, y + s);
            g.addColorStop(0, "#8a8aa3");
            g.addColorStop(1, "#4a4a60");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.roundRect(x, y, s, s, 4);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,.18)";
            ctx.fillRect(x + 3, y + 3, s - 8, 3);
        });
    }

    function drawFood(now) {
        if (food) {
            const cx = food.x * CELL + CELL / 2, cy = food.y * CELL + CELL / 2 + 1;
            const r = 7.5 + Math.sin(now / 220) * 0.7;
            const g = ctx.createRadialGradient(cx - 2, cy - 3, 1, cx, cy, r + 2);
            g.addColorStop(0, "#ff8a80");
            g.addColorStop(1, "#c4161c");
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,.55)";
            ctx.beginPath(); ctx.arc(cx - 2.5, cy - 3, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#3fb950";
            ctx.beginPath(); ctx.ellipse(cx + 2.5, cy - r + 0.5, 3.5, 1.8, -0.5, 0, Math.PI * 2); ctx.fill();
        }
        if (bonus) {
            const cx = bonus.x * CELL + CELL / 2, cy = bonus.y * CELL + CELL / 2;
            const left = Math.max(0, (bonus.expires - gameTime) / BONUS_LIFETIME);
            const r = 6.5 + Math.sin(now / 120);
            ctx.fillStyle = "#ffd166";
            ctx.shadowColor = "#ffd166";
            ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(cx, cy, 9.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left); ctx.stroke();
        }
    }

    function drawSnake(t) {
        const pos = snake.map((p, i) => {
            const q = prev[i] || p;
            const jump = Math.abs(p.x - q.x) > 1 || Math.abs(p.y - q.y) > 1;   // wrapped around the edge
            return { x: (jump ? p.x : lerp(q.x, p.x, t)) * CELL + CELL / 2, y: (jump ? p.y : lerp(q.y, p.y, t)) * CELL + CELL / 2, jump };
        });
        const count = pos.length;
        const radius = i => 9.5 - (6 * i) / Math.max(count - 1, 1) * 0.5;
        const color = i => `hsl(258 80% ${72 - (30 * i) / Math.max(count - 1, 1)}%)`;

        ctx.lineCap = "round";
        for (let i = count - 1; i > 0; i--) {
            ctx.strokeStyle = color(i);
            ctx.fillStyle = color(i);
            ctx.lineWidth = radius(i) * 2;
            const wrapped = pos[i].jump || pos[i - 1].jump;
            if (!wrapped) {
                ctx.beginPath(); ctx.moveTo(pos[i].x, pos[i].y); ctx.lineTo(pos[i - 1].x, pos[i - 1].y); ctx.stroke();
            }
            ctx.beginPath(); ctx.arc(pos[i].x, pos[i].y, radius(i), 0, Math.PI * 2); ctx.fill();
        }

        const head = pos[0], d = DIRS[dir];
        ctx.fillStyle = color(0);
        ctx.shadowColor = "rgba(124, 77, 255, .8)";
        ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(head.x, head.y, 10, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;

        [-1, 1].forEach(side => {
            const ex = head.x + d.x * 3.5 - d.y * 4.5 * side, ey = head.y + d.y * 3.5 + d.x * 4.5 * side;
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(ex, ey, 2.8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#111";
            ctx.beginPath(); ctx.arc(ex + d.x * 1, ey + d.y * 1, 1.4, 0, Math.PI * 2); ctx.fill();
        });
    }

    function draw(t, now) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawBoard();
        drawObstacles();
        drawFood(now);
        drawSnake(t);
    }

    /* ---------- Main loop (fixed-step logic, smooth drawing) ---------- */
    function frame(now) {
        requestAnimationFrame(frame);
        const dt = Math.min(now - lastFrame, 100);
        lastFrame = now;

        if (status === "running") {
            gameTime += dt;
            acc += dt;
            if (bonus && gameTime > bonus.expires) bonus = null;
            let iv = interval();
            while (acc >= iv && status === "running") {
                acc -= iv;
                step();
                iv = interval();
            }
            lastT = Math.min(acc / interval(), 1);
        }
        draw(status === "idle" || status === "over" ? 1 : lastT, now);
    }

    /* ---------- Input ---------- */
    function steer(next) {
        if (status !== "running") return;
        const last = queue.length ? queue[queue.length - 1] : dir;
        if (next !== last && next !== OPP[last] && queue.length < 2) queue.push(next);
    }

    const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };

    document.addEventListener("keydown", e => {
        const dirKey = KEYS[e.key] || KEYS[e.key.toLowerCase()];
        if (dirKey) {
            e.preventDefault();
            if (status === "idle" || status === "over") startGame();
            steer(dirKey);
        } else if (e.key === " " || e.key.toLowerCase() === "p") {
            if (document.activeElement && document.activeElement.tagName === "BUTTON" && e.key === " ") return;
            e.preventDefault();
            if (status === "running") pause();
            else if (status === "paused") resume();
            else startGame();
        }
    });

    document.querySelectorAll(".pad button").forEach(b => b.addEventListener("click", () => steer(b.dataset.dir)));

    let touch = null;
    canvas.addEventListener("touchstart", e => { touch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
    canvas.addEventListener("touchend", e => {
        if (!touch) return;
        const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
        touch = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    }, { passive: true });

    startBtn.addEventListener("click", startGame);
    pauseBtn.addEventListener("click", () => (status === "running" ? pause() : resume()));
    soundBtn.addEventListener("click", () => {
        sound.on = !sound.on;
        soundBtn.textContent = sound.on ? "🔊" : "🔇";
        soundBtn.setAttribute("aria-pressed", String(sound.on));
    });
    document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
    window.addEventListener("blur", pause);

    /* ---------- Init ---------- */
    toIdle();
    requestAnimationFrame(t => { lastFrame = t; frame(t); });
})();
</script>

</body>
</html>
