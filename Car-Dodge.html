<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameForge - Car Dodge</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    width: 95%;
    max-width: 450px;
    margin: 20px auto;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 15px;
}

.info {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
}

.info div {
    background: #15151f;
    padding: 10px 20px;
    border-radius: 10px;
}

#road {
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 600px;
    margin: auto;
    background: #292929;
    border: 4px solid #6c2cff;
    border-radius: 12px;
    overflow: hidden;
}

/* Road lines */

.line {
    position: absolute;
    width: 8px;
    height: 70px;
    background: white;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.7;
}

#player {
    position: absolute;
    width: 50px;
    height: 85px;
    background: #6c2cff;
    border-radius: 10px;
    bottom: 25px;
    left: calc(50% - 25px);
    box-shadow: 0 0 15px rgba(108,44,255,0.7);
}

#player::before {
    content: "";
    position: absolute;
    width: 30px;
    height: 25px;
    background: #9f8cff;
    border-radius: 5px;
    top: 10px;
    left: 10px;
}

.enemy {
    position: absolute;
    width: 50px;
    height: 85px;
    background: #ef4444;
    border-radius: 10px;
}

.enemy::before {
    content: "";
    position: absolute;
    width: 30px;
    height: 25px;
    background: #ff9999;
    border-radius: 5px;
    top: 10px;
    left: 10px;
}

button {
    border: none;
    background: #6c2cff;
    color: white;
    padding: 12px 25px;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #8b5cff;
}

#start {
    margin-top: 15px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 15px;
}

.controls button {
    font-size: 25px;
    padding: 10px 25px;
}

#message {
    min-height: 25px;
    color: #ccc;
}

.back {
    display: inline-block;
    margin-top: 10px;
    color: #aaa;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<h1>🚗 Car Dodge</h1>

<div class="subtitle">
GameForge Mini Game
</div>

<div class="info">

    <div>
        Score: <b id="score">0</b>
    </div>

    <div>
        Best: <b id="best">0</b>
    </div>

</div>


<div id="road">

    <div class="line" style="top: 20px;"></div>
    <div class="line" style="top: 180px;"></div>
    <div class="line" style="top: 340px;"></div>
    <div class="line" style="top: 500px;"></div>

    <div id="player"></div>

</div>


<button id="start">
Start Game
</button>


<div class="controls">

    <button onclick="moveLeft()">⬅️</button>

    <button onclick="moveRight()">➡️</button>

</div>


<p id="message">
Avoid the red cars!
</p>


<a class="back" href="games.html">
← Back to Games
</a>

</div>


<script>

const road = document.getElementById("road");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");

const startButton = document.getElementById("start");
const message = document.getElementById("message");

let playerX = 175;

let score = 0;
let best = Number(localStorage.getItem("carDodgeBest")) || 0;

let gameRunning = false;

let enemies = [];

let gameTimer;
let enemyTimer;

bestText.textContent = best;


/* START */

function startGame() {

    clearInterval(gameTimer);
    clearInterval(enemyTimer);

    enemies.forEach(enemy => enemy.remove());

    enemies = [];

    playerX = 175;

    player.style.left = playerX + "px";

    score = 0;

    scoreText.textContent = score;

    gameRunning = true;

    message.textContent =
        "Avoid the red cars!";

    startButton.textContent =
        "Restart Game";


    gameTimer = setInterval(
        updateGame,
        20
    );


    enemyTimer = setInterval(
        createEnemy,
        1000
    );

}


/* CREATE ENEMY */

function createEnemy() {

    if (!gameRunning) return;


    const enemy =
        document.createElement("div");

    enemy.className = "enemy";


    const lane =
        Math.floor(Math.random() * 3);


    const positions = [
        45,
        175,
        305
    ];


    enemy.style.left =
        positions[lane] + "px";

    enemy.style.top =
        "-90px";


    road.appendChild(enemy);

    enemies.push(enemy);
}


/* UPDATE */

function updateGame() {

    if (!gameRunning) return;


    enemies.forEach((enemy, index) => {

        let y =
            parseInt(enemy.style.top);


        y += 5;


        enemy.style.top =
            y + "px";


        /* Collision */

        const playerRect =
            player.getBoundingClientRect();

        const enemyRect =
            enemy.getBoundingClientRect();


        if (
            playerRect.left < enemyRect.right &&
            playerRect.right > enemyRect.left &&
            playerRect.top < enemyRect.bottom &&
            playerRect.bottom > enemyRect.top
        ) {

            gameOver();

            return;
        }


        /* Passed */

        if (y > 620) {

            enemy.remove();

            enemies.splice(index, 1);

            score++;

            scoreText.textContent =
                score;


            if (score > best) {

                best = score;

                bestText.textContent =
                    best;

                localStorage.setItem(
                    "carDodgeBest",
                    best
                );
            }
        }

    });

}


/* LEFT */

function moveLeft() {

    if (!gameRunning) return;

    playerX -= 130;

    if (playerX < 45) {
        playerX = 45;
    }

    player.style.left =
        playerX + "px";
}


/* RIGHT */

function moveRight() {

    if (!gameRunning) return;

    playerX += 130;

    if (playerX > 305) {
        playerX = 305;
    }

    player.style.left =
        playerX + "px";
}


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowLeft") {
            moveLeft();
        }

        if (event.key === "ArrowRight") {
            moveRight();
        }

    }
);


/* GAME OVER */

function gameOver() {

    gameRunning = false;

    clearInterval(gameTimer);
    clearInterval(enemyTimer);

    message.textContent =
        "💥 Game Over! Score: " + score;

    startButton.textContent =
        "Play Again";
}


/* START BUTTON */

startButton.addEventListener(
    "click",
    startGame
);

</script>

</body>
</html>
