<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Warriors: Steel & Magic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d0f12;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 900px;
            height: 600px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 140, 0, 0.3);
            border: 2px solid #3a3228;
            border-radius: 8px;
            overflow: hidden;
            background: #15181e;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .stats-panel {
            display: flex;
            gap: 20px;
            background: rgba(15, 18, 24, 0.75);
            padding: 12px 20px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }
        .stat-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0aab8;
        }
        .bar-container {
            width: 160px;
            height: 12px;
            background: #202630;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.5);
        }
        .bar-fill {
            height: 100%;
            transition: width 0.15s ease-out;
        }
        #hp-fill { background: linear-gradient(90deg, #e53935, #ff5252); }
        #xp-fill { background: linear-gradient(90deg, #fb8c00, #ffb74d); }
        
        .hud-text {
            font-size: 14px;
            font-weight: bold;
            color: #f0f4f8;
        }
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 16, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(6px);
        }
        .screen-title {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ff9800;
            text-shadow: 0 0 15px rgba(255, 152, 0, 0.5);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .screen-subtitle {
            font-size: 16px;
            color: #90a4ae;
            margin-bottom: 30px;
            text-align: center;
            max-width: 450px;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #111;
            border: none;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.6);
            background: linear-gradient(135deg, #ffa726, #fb8c00);
        }
        .controls-hint {
            margin-top: 30px;
            font-size: 13px;
            color: #607d8b;
            display: flex;
            gap: 15px;
        }
        .key {
            background: #263238;
            color: #eceff1;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #37474f;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        
        <div id="ui-overlay">
            <div class="stats-panel">
                <div class="stat-group">
                    <span class="stat-label">Health</span>
                    <div class="bar-container"><div id="hp-fill" class="bar-fill" style="width: 100%;"></div></div>
                </div>
                <div class="stat-group">
                    <span class="stat-label">Experience</span>
                    <div class="bar-container"><div id="xp-fill" class="bar-fill" style="width: 0%;"></div></div>
                </div>
                <div class="stat-group">
                    <span class="stat-label">Level</span>
                    <span id="level-display" class="hud-text">1</span>
                </div>
                <div class="stat-group">
                    <span class="stat-label
