<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Metropolis Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-viewport isometric game. HUD strip on top, map canvas fills the middle, tool dock below. Budget, goals and menu open as sheets. */
:root{
  --bg:#090f16; --panel:#111b26; --panel2:#17263a; --line:#233548; --fg:#e7eff6; --mut:#8ba1b5;
  --accent:#6cc8f5; --accent-ink:#06202e; --good:#5fd08a; --warn:#f2b544; --bad:#f2706b;
  --zr:#5fd08a; --zc:#5aa9f5; --zi:#f2b544;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}

#hud{background:linear-gradient(var(--panel),#0e1722);border-bottom:1px solid var(--line);z-index:5;flex:0 0 auto}
.hud-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{min-width:0}
h1{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.16em;text-transform:uppercase;margin:0;color:var(--accent);line-height:1}
.cityline{display:flex;align-items:center;gap:8px;margin-top:4px}
#cityName{background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--fg);width:130px;padding:1px 0;font-size:13px;font-weight:500}
.tier{font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:2px 6px;border-radius:3px;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;flex:1 1 340px;min-width:0}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat label{font:500 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.stat b{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{font:400 10.5px var(--f-mono);color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{display:block;height:3px;border-radius:2px;background:#0b141d;overflow:hidden;margin-top:2px;width:76px}
.meter u{display:block;height:100%;width:0;background:var(--accent);text-decoration:none;transition:width .3s}
.rci{display:flex;gap:7px;align-items:flex-start}
.rci .col{display:flex;flex-direction:column;align-items:center;gap:2px}
.dm{position:relative;width:12px;height:30px;background:#0b141d;border-radius:2px;overflow:hidden}
.dm::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.dm u{position:absolute;left:0;right:0;text-decoration:none;transition:height .3s}
.rci .dl{font:600 9px var(--f-mono);color:var(--mut)}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
