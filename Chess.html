<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameForge - Chess</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    width: 95%;
    max-width: 500px;
    margin: 20px auto;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 15px;
}

.info {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
}

.info div {
    background: #15151f;
    padding: 10px 18px;
    border-radius: 10px;
}

#board {
    width: min(92vw, 440px);
    height: min(92vw, 440px);
    margin: auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border: 4px solid #6c2cff;
    border-radius: 8px;
    overflow: hidden;
}

.square {
    width: 100%;
    aspect-ratio: 1;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 9vw, 48px);
    cursor: pointer;
}

.light {
    background: #e8d8bd;
}

.dark {
    background: #8b6b4a;
}

.selected {
    box-shadow: inset 0 0 0 5px #6c2cff;
}
