<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameForge - Chess</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at top, #21124d 0%, #090612 45%, #030307 100%);
    color:white;
    display:flex;
    justify-content:center;
    padding:25px 12px;
}

.container{
    width:min(100%, 850px);
    text-align:center;
}

h1{
    margin:5px 0 8px;
    font-size:clamp(32px,7vw,55px);
    color:#b66cff;
    text-shadow:
        0 0 10px #8b2cff,
        0 0 30px #6120ff;
}

.subtitle{
    color:#aaa;
    margin-bottom:15px;
}

.status{
    min-height:35px;
    font-size:20px;
    font-weight:bold;
    color:#53e8ff;
    text-shadow:0 0 10px #00d9ff;
    margin:8px;
}

.board{
    width:min(92vw,720px);
    aspect-ratio:1/1;
    margin:15px auto;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    border:5px solid #7d35ff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:
        0 0 15px #7d35ff,
        0 0 40px rgba(95,20,255,.55),
        inset 0 0 25px #000;
}

.square{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
}

.square.light{
    background:linear-gradient(135deg,#3d4658,#252c3b);
}

.square.dark{
    background:linear-gradient(135deg,#171b27,#0c0f17);
}

.square:hover{
    filter:brightness(1.35);
}

.square.selected{
    box-shadow:
        inset 0 0 0 4px #00eaff,
        inset 0 0 25px #00eaff;
}

.square.last{
    box-shadow:inset 0 0 0 4px rgba(255,210,60,.65);
}

.square.check{
    background:radial-gradient(circle,#ff2020,#501010 60%,#170707);
    box-shadow:inset 0 0 30px red;
}

.move-dot{
    width:22%;
    height:22%;
    border-radius:50%;
    background:#36eaff;
    box-shadow:0 0 12px #00eaff;
    position:absolute;
}

.capture-mark{
    position:absolute;
    inset:7%;
    border:4px solid #ff3864;
    border-radius:50%;
    box-shadow:0 0 15px #ff174f;
}

.piece{
    position:relative;
    z-index:2;
    font-size:clamp(35px,7vw,65px);
    line-height:1;
    cursor:pointer;
    transition:.15s;
}

.piece:hover{
    transform:scale(1.08);
}

.white-piece{
    color:#ffffff;
    text-shadow:
        0 0 3px #fff,
        0 0 10px #00d9ff,
        2px 2px 3px #000;
}

.black-piece{
    color:#11131b;
    text-shadow:
        0 0 3px #8f8fff,
        0 0 10px #704cff,
        2px 2px 3px #000;
}

.controls{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:15px 0;
}

button,
.back{
    border:none;
    padding:12px 22px;
    border-radius:9px;
    background:linear-gradient(135deg,#642cff,#a43cff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    box-shadow:0 0 12px rgba(116,45,255,.5);
    transition:.25s;
}

button:hover,
.back:hover{
    transform:translateY(-3px);
    box-shadow:0 0 25px rgba(100,50,255,.8);
}

.info{
    margin:15px auto;
    padding:12px;
    max-width:720px;
    border:1px solid rgba(140,80,255,.4);
    border-radius:10px;
    background:rgba(20,15,40,.7);
    color:#aaa;
    font-size:14px;
}

.promotion{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.promotion-box{
    background:#11101c;
    border:2px solid #8c42ff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 0 40px #682cff;
}

.promotion-box h2{
    margin-top:0;
    color:#b76cff;
}

.promo-buttons{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
}

.promo-buttons button{
    font-size:35px;
    padding:10px 18px;
}

@media(max-width:500px){
    body{
        padding:15px 5px;
    }

    .board{
        width:96vw;
        border-width:3px;
    }

    .piece{
        font-size:11vw;
    }

    .move-dot{
        width:20%;
        height:20%;
    }

    .capture-mark{
        border-width:2px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>♟ Cyber Chess</h1>
    <div class="subtitle">GameForge • Classic Chess</div>

    <div id="status" class="status">White's Turn</div>

    <div id="board" class="board"></div>

    <div class="controls">
        <button onclick="newGame()">🔄 New Game</button>
        <button onclick="undoMove()">↩ Undo</button>
    </div>

    <div class="info">
        ♟ Click a piece to see legal moves.<br>
        👑 Check, Checkmate, Castling, En Passant and Promotion supported.
    </div>

    <a href="games.html" class="back">← Back to Games</a>

</div>

<div id="promotion" class="promotion">
    <div class="promotion-box">
        <h2>Choose Promotion</h2>
        <div class="promo-buttons">
            <button onclick="promote('q')">♕</button>
            <button onclick="promote('r')">♖</button>
            <button onclick="promote('b')">♗</button>
            <button onclick="promote('n')">♘</button>
        </div>
    </div>
</div>

<script>

const boardElement = document.getElementById("board");
const statusElement = document.getElementById("status");
const promotionElement = document.getElementById("promotion");

const symbols = {
    w:{
        k:"♔",
        q:"♕",
        r:"♖",
        b:"♗",
        n:"♘",
        p:"♙"
    },
    b:{
        k:"♚",
        q:"♛",
        r:"♜",
        b:"♝",
        n:"♞",
        p:"♟"
    }
};

let board;
let turn;
let selected = null;
let legalMoves = [];
let history = [];
let lastMove = null;
let enPassant = null;
let promotionData = null;
let gameOver = false;

function createInitialBoard(){

    return [

        [
            {c:"b",p:"r"},
            {c:"b",p:"n"},
            {c:"b",p:"b"},
            {c:"b",p:"q"},
            {c:"b",p:"k"},
            {c:"b",p:"b"},
            {c:"b",p:"n"},
            {c:"b",p:"r"}
        ],

        [
            {c:"b",p:"p"},
            {c:"b",p:"p"},
            {c:"b",p:"p"},
            {c:"b",p:"p"},
            {c:"b",p:"p"},
            {c:"b",p:"p"},
            {c:"b",p:"p"},
            {c:"b",p:"p"}
        ],

        Array(8).fill(null),
        Array(8).fill(null),
        Array(8).fill(null),
        Array(8).fill(null),

        [
            {c:"w",p:"p"},
            {c:"w",p:"p"},
            {c:"w",p:"p"},
            {c:"w",p:"p"},
            {c:"w",p:"p"},
            {c:"w",p:"p"},
            {c:"w",p:"p"},
            {c:"w",p:"p"}
        ],

        [
            {c:"w",p:"r"},
            {c:"w",p:"n"},
            {c:"w",p:"b"},
            {c:"w",p:"q"},
            {c:"w",p:"k"},
            {c:"w",p:"b"},
            {c:"w",p:"n"},
            {c:"w",p:"r"}
        ]

    ];
}

function cloneBoard(b){
    return b.map(row =>
        row.map(piece => piece ? {...piece} : null)
    );
}

function newGame(){

    board = createInitialBoard();
    turn = "w";

    selected = null;
    legalMoves = [];
    history = [];
    lastMove = null;
    enPassant = null;
    promotionData = null;
    gameOver = false;

    promotionElement.style.display = "none";

    render();
}

function render(){

    boardElement.innerHTML = "";

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const square = document.createElement("div");

            square.className =
                "square " +
                ((r+c)%2===0 ? "light" : "dark");

            square.dataset.r = r;
            square.dataset.c = c;

            if(
                selected &&
                selected.r === r &&
                selected.c === c
            ){
                square.classList.add("selected");
            }

            if(
                lastMove &&
                (
                    (lastMove.from.r===r && lastMove.from.c===c) ||
                    (lastMove.to.r===r && lastMove.to.c===c)
                )
            ){
                square.classList.add("last");
            }

            if(
                isKingInCheck(turn) &&
                board[r][c] &&
                board[r][c].c===turn &&
                board[r][c].p==="k"
            ){
                square.classList.add("check");
            }

            const move = legalMoves.find(
                m => m.r===r && m.c===c
            );

            if(move){

                if(board[r][c] || move.enPassant){
                    const mark = document.createElement("div");
                    mark.className = "capture-mark";
                    square.appendChild(mark);
                }else{
                    const dot = document.createElement("div");
                    dot.className = "move-dot";
                    square.appendChild(dot);
                }
            }

            const piece = board[r][c];

            if(piece){

                const span = document.createElement("span");

                span.className =
                    "piece " +
                    (piece.c==="w"
                        ? "white-piece"
                        : "black-piece");

                span.textContent = symbols[piece.c][piece.p];

                square.appendChild(span);
            }

            square.addEventListener("click",()=>{
                handleSquareClick(r,c);
            });

            boardElement.appendChild(square);
        }
    }

    updateStatus();
}

function handleSquareClick(r,c){

    if(gameOver || promotionData) return;

    const piece = board[r][c];

    if(selected){

        const move = legalMoves.find(
            m => m.r===r && m.c===c
        );

        if(move){
            makeMove(move);
            return;
        }

        if(piece && piece.c===turn){
            selectPiece(r,c);
            return;
        }

        selected = null;
        legalMoves = [];
        render();
        return;
    }

    if(piece && piece.c===turn){
        selectPiece(r,c);
    }
}

function selectPiece(r,c){

    selected = {r,c};

    legalMoves = getLegalMoves(r,c);

    render();
}

function inside(r,c){
    return r>=0 && r<8 && c>=0 && c<8;
}

function opposite(color){
    return color==="w" ? "b" : "w";
}

function getPseudoMoves(b,r,c,ignoreKingSafety=false){

    const piece = b[r][c];

    if(!piece) return [];

    const moves = [];

    const add = (rr,cc,extra={}) => {

        if(!inside(rr,cc)) return;

        const target = b[rr][cc];

        if(!target){
            moves.push({r:rr,c:cc,...extra});
        }
        else if(target.c!==piece.c && target.p!=="k"){
            moves.push({r:rr,c:cc,...extra});
        }
    };

    if(piece.p==="p"){

        const dir = piece.c==="w" ? -1 : 1;
        const startRow = piece.c==="w" ? 6 : 1;

        if(inside(r+dir,c) && !b[r+dir][c]){

            moves.push({
                r:r+dir,
                c:c
            });

            if(
                r===startRow &&
                !b[r+2*dir][c]
            ){
                moves.push({
                    r:r+2*dir,
                    c:c,
                    doublePawn:true
                });
            }
        }

        for(const dc of [-1,1]){

            const rr=r+dir;
            const cc=c+dc;

            if(!inside(rr,cc)) continue;

            const target=b[rr][cc];

            if(target && target.c!==piece.c && target.p!=="k"){

                moves.push({
                    r:rr,
                    c:cc
                });
            }

            if(
                enPassant &&
                enPassant.r===rr &&
                enPassant.c===cc
            ){

                moves.push({
                    r:rr,
                    c:cc,
                    enPassant:true
                });
            }
        }
    }

    if(piece.p==="n"){

        const jumps=[
            [-2,-1],[-2,1],
            [-1,-2],[-1,2],
            [1,-2],[1,2],
            [2,-1],[2,1]
        ];

        jumps.forEach(([dr,dc])=>{
            add(r+dr,c+dc);
        });
    }

    if(
        piece.p==="b" ||
        piece.p==="r" ||
        piece.p==="q"
    ){

        const directions=[];

        if(piece.p==="b" || piece.p==="q"){
            directions.push(
                [-1,-1],
                [-1,1],
                [1,-1],
                [1,1]
            );
        }

        if(piece.p==="r" || piece.p==="q"){
            directions.push(
                [-1,0],
                [1,0],
                [0,-1],
                [0,1]
            );
        }

        for(const [dr,dc] of directions){

            let rr=r+dr;
            let cc=c+dc;

            while(inside(rr,cc)){

                const target=b[rr][cc];

                if(!target){

                    moves.push({
                        r:rr,
                        c:cc
                    });

                }else{

                    if(
                        target.c!==piece.c &&
                        target.p!=="k"
                    ){
                        moves.push({
                            r:rr,
                            c:cc
                        });
                    }

                    break;
                }

                rr+=dr;
                cc+=dc;
            }
        }
    }

    if(piece.p==="k"){

        for(let dr=-1;dr<=1;dr++){
            for(let dc=-1;dc<=1;dc++){

                if(dr===0 && dc===0) continue;

                add(r+dr,c+dc);
            }
        }

        /*
          Castling
        */

        if(!ignoreKingSafety){

            const rights =
                piece.c==="w"
                ? {
                    king: "wKing",
                    queen:"wQueen"
                }
                : {
                    king:"bKing",
                    queen:"bQueen"
                };

            if(!piece.moved && !isSquareAttacked(b,r,c,opposite(piece.c))){

                // King side

                if(
                    canCastle(rights.king) &&
                    !b[r][c+1] &&
                    !b[r][c+2] &&
                    !isSquareAttacked(b,r,c+1,opposite(piece.c)) &&
                    !isSquareAttacked(b,r,c+2,opposite(piece.c))
                ){

                    moves.push({
                        r:r,
                        c:c+2,
                        castle:"king"
                    });
                }

                // Queen side

                if(
                    canCastle(rights.queen) &&
                    !b[r][c-1] &&
                    !b[r][c-2] &&
                    !b[r][c-3] &&
                    !isSquareAttacked(b,r,c-1,opposite(piece.c)) &&
                    !isSquareAttacked(b,r,c-2,opposite(piece.c))
                ){

                    moves.push({
                        r:r,
                        c:c-2,
                        castle:"queen"
                    });
                }
            }
        }
    }

    return moves;
}

function canCastle(side){

    if(side==="wKing"){
        const king=board[7][4];
        const rook=board[7][7];

        return (
            king &&
            rook &&
            king.p==="k" &&
            rook.p==="r" &&
            king.c==="w" &&
            rook.c==="w" &&
            !king.moved &&
            !rook.moved
        );
    }

    if(side==="wQueen"){
        const king=board[7][4];
        const rook=board[7][0];

        return (
            king &&
            rook &&
            king.p==="k" &&
            rook.p==="r" &&
            king.c==="w" &&
            rook.c==="w" &&
            !king.moved &&
            !rook.moved
        );
    }

    if(side==="bKing"){
        const king=board[0][4];
        const rook=board[0][7];

        return (
            king &&
            rook &&
            king.p==="k" &&
            rook.p==="r" &&
            king.c==="b" &&
            rook.c==="b" &&
            !king.moved &&
            !rook.moved
        );
    }

    if(side==="bQueen"){
        const king=board[0][4];
        const rook=board[0][0];

        return (
            king &&
            rook &&
            king.p==="k" &&
            rook.p==="r" &&
            king.c==="b" &&
            rook.c==="b" &&
            !king.moved &&
            !rook.moved
        );
    }

    return false;
}

function findKing(b,color){

    for(let r=0;r<8;r++){
        for(let c=0;c<8;c++){

            if(
                b[r][c] &&
                b[r][c].c===color &&
                b[r][c].p==="k"
            ){
                return {r,c};
            }
        }
    }

    return null;
}

function isSquareAttacked(b,r,c,byColor){

    /*
      Pawn attacks
    */

    const pawnRow = byColor==="w" ? r+1 : r-1;

    for(const dc of [-1,1]){

        const cc=c+dc;

        if(
            inside(pawnRow,cc) &&
            b[pawnRow][cc] &&
            b[pawnRow][cc].c===byColor &&
            b[pawnRow][cc].p==="p"
        ){
            return true;
        }
    }

    /*
      Knight attacks
    */

    const knightMoves=[
        [-2,-1],[-2,1],
        [-1,-2],[-1,2],
        [1,-2],[1,2],
        [2,-1],[2,1]
    ];

    for(const [dr,dc] of knightMoves){

        const rr=r+dr;
        const cc=c+dc;

        if(
            inside(rr,cc) &&
            b[rr][cc] &&
            b[rr][cc].c===byColor &&
            b[rr][cc].p==="n"
        ){
            return true;
        }
    }

    /*
      King attacks
    */

    for(let dr=-1;dr<=1;dr++){
        for(let dc=-1;dc<=1;dc++){

            if(dr===0 && dc===0) continue;

            const rr=r+dr;
            const cc=c+dc;

            if(
                inside(rr,cc) &&
                b[rr][cc] &&
                b[rr][cc].c===byColor &&
                b[rr][cc].p==="k"
            ){
                return true;
            }
        }
    }

    /*
      Rook / Queen
    */

    const straight=[
        [-1,0],
        [1,0],
        [0,-1],
        [0,1]
    ];

    for(const [dr,dc] of straight){

        let rr=r+dr;
        let cc=c+dc;

        while(inside(rr,cc)){

            const p=b[rr][cc];

            if(p){

                if(
                    p.c===byColor &&
                    (p.p==="r" || p.p==="q")
                ){
                    return true;
                }

                break;
            }

            rr+=dr;
            cc+=dc;
        }
    }

    /*
      Bishop / Queen
    */

    const diagonal=[
        [-1,-1],
        [-1,1],
        [1,-1],
        [1,1]
    ];

    for(const [dr,dc] of diagonal){

        let rr=r+dr;
        let cc=c+dc;

        while(inside(rr,cc)){

            const p=b[rr][cc];

            if(p){

                if(
                    p.c===byColor &&
                    (p.p==="b" || p.p==="q")
                ){
                    return true;
                }

                break;
            }

            rr+=dr;
            cc+=dc;
        }
    }

    return false;
}

function isKingInCheck(color,b=board){

    const king=findKing(b,color);

    if(!king) return true;

    return isSquareAttacked(
        b,
        king.r,
        king.c,
        opposite(color)
    );
}

function simulateMove(b,from,move){

    const copy=cloneBoard(b);

    const piece=copy[from.r][from.c];

    copy[from.r][from.c]=null;

    /*
      En passant
    */

    if(move.enPassant){

        const dir=piece.c==="w" ? 1 : -1;

        copy[move.r+dir][move.c]=null;
    }

    copy[move.r][move.c]=piece;

    /*
      Castling
    */

    if(move.castle){

        const row=from.r;

        if(move.castle==="king"){

            copy[row][5]=copy[row][7];
            copy[row][7]=null;

        }else{

            copy[row][3]=copy[row][0];
            copy[row][0]=null;
        }
    }

    return copy;
}

function getLegalMoves(r,c){

    const piece=board[r][c];

    if(!piece || piece.c!==turn){
        return [];
    }

    const pseudo=getPseudoMoves(
        board,
        r,
        c
    );

    const legal=[];

    for(const move of pseudo){

        const test=simulateMove(
            board,
            {r,c},
            move
        );

        if(!isKingInCheck(piece.c,test)){
            legal.push(move);
        }
    }

    return legal;
}

function makeMove(move){

    const from={...selected};

    const piece=board[from.r][from.c];

    /*
      Save position for undo
    */

    history.push({
        board:cloneBoard(board),
        turn:turn,
        enPassant:enPassant
            ? {...enPassant}
            : null,
        lastMove:lastMove
            ? {
                from:{...lastMove.from},
                to:{...lastMove.to}
            }
            : null
    });

    const captured=board[move.r][move.c];

    /*
      En passant capture
    */

    if(move.enPassant){

        const dir=piece.c==="w" ? 1 : -1;

        board[move.r+dir][move.c]=null;
    }

    board[from.r][from.c]=null;

    piece.moved=true;

    board[move.r][move.c]=piece;

    /*
      Castling rook
    */

    if(move.castle){

        const row=from.r;

        if(move.castle==="king"){

            board[row][5]=board[row][7];
            board[row][7]=null;

            if(board[row][5]){
                board[row][5].moved=true;
            }

        }else{

            board[row][3]=board[row][0];
            board[row][0]=null;

            if(board[row][3]){
                board[row][3].moved=true;
            }
        }
    }

    /*
      En passant target
    */

    enPassant=null;

    if(
        piece.p==="p" &&
        Math.abs(move.r-from.r)===2
    ){

        enPassant={
            r:(move.r+from.r)/2,
            c:move.c
        };
    }

    lastMove={
        from,
        to:{
            r:move.r,
            c:move.c
        }
    };

    /*
      Pawn promotion
    */

    if(
        piece.p==="p" &&
        (move.r===0 || move.r===7)
    ){

        promotionData={
            r:move.r,
            c:move.c
        };

        promotionElement.style.display="flex";

        return;
    }

    finishTurn();
}

function promote(type){

    if(!promotionData) return;

    const piece=board[
        promotionData.r
    ][
        promotionData.c
    ];

    piece.p=type;

    promotionData=null;

    promotionElement.style.display="none";

    finishTurn();
}

function finishTurn(){

    selected=null;
    legalMoves=[];

    turn=opposite(turn);

    render();

    const moves=getAllLegalMoves(turn);

    if(moves.length===0){

        gameOver=true;

        if(isKingInCheck(turn)){

            const winner =
                turn==="w"
                ? "Black"
                : "White";

            statusElement.textContent =
                "♚ CHECKMATE — " +
                winner +
                " Wins!";

        }else{

            statusElement.textContent =
                "🤝 STALEMATE — Draw!";
        }

        return;
    }

    if(isKingInCheck(turn)){

        statusElement.textContent =
            (turn==="w" ? "White" : "Black") +
            " is in CHECK!";

    }else{

        statusElement.textContent =
            turn==="w"
            ? "White's Turn"
            : "Black's Turn";
    }
}

function getAllLegalMoves(color){

    const oldTurn=turn;

    turn=color;

    const result=[];

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            if(
                board[r][c] &&
                board[r][c].c===color
            ){

                const moves=getLegalMoves(r,c);

                moves.forEach(move=>{
                    result.push({
                        from:{r,c},
                        move
                    });
                });
            }
        }
    }

    turn=oldTurn;

    return result;
}

function updateStatus(){

    if(gameOver) return;

    if(isKingInCheck(turn)){

        statusElement.textContent =
            (turn==="w" ? "White" : "Black") +
            " is in CHECK!";

    }else{

        statusElement.textContent =
            turn==="w"
            ? "White's Turn"
            : "Black's Turn";
    }
}

function undoMove(){

    if(history.length===0 || promotionData){
        return;
    }

    const previous=history.pop();

    board=cloneBoard(previous.board);

    turn=previous.turn;

    enPassant=previous.enPassant
        ? {...previous.enPassant}
        : null;

    lastMove=previous.lastMove
        ? {
            from:{...previous.lastMove.from},
            to:{...previous.lastMove.to}
        }
        : null;

    selected=null;
    legalMoves=[];
    gameOver=false;

    render();
}

newGame();

</script>
