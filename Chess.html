<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameForge Chess</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #24105c 0%, #0b0b0f 45%);
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 96%;
    max-width: 1100px;
    margin: 25px auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    font-size: 42px;
}

.header p {
    color: #aaa;
    margin-top: 8px;
}

.game-layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 25px;
}

.left {
    text-align: center;
}

#board {
    width: min(92vw, 560px);
    height: min(92vw, 560px);

    display: grid;
    grid-template-columns: repeat(8, 1fr);

    border: 5px solid #6c2cff;
    border-radius: 10px;

    overflow: hidden;

    box-shadow:
        0 0 30px rgba(108, 44, 255, 0.35);
}

.square {
    border: none;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: clamp(30px, 8vw, 62px);

    cursor: pointer;

    position: relative;
}

.light {
    background: #ead9bd;
}

.dark {
    background: #8b6b4a;
}

.square:hover {
    filter: brightness(1.12);
}

.selected {
    box-shadow:
        inset 0 0 0 5px #6c2cff;
}

.legal {
    box-shadow:
        inset 0 0 0 5px rgba(34, 197, 94, 0.9);
}

.capture {
    box-shadow:
        inset 0 0 0 5px rgba(239, 68, 68, 0.9);
}

.check {
    background: #b91c1c !important;
}

.panel {
    width: 280px;
    background: #15151f;
    border: 1px solid #29293a;
    border-radius: 15px;
    padding: 20px;
}

.turn {
    background: #0b0b0f;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 15px;
}

.turn strong {
    color: #a78bfa;
}

.status {
    min-height: 45px;
    color: #ddd;
    margin-bottom: 15px;
}

.buttons {
    display: flex;
    gap: 10px;
}

.buttons button {
    flex: 1;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 15px;
    background: #6c2cff;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #8b5cff;
}

button:disabled {
    background: #444;
    cursor: not-allowed;
}

.history-title {
    margin-top: 25px;
    margin-bottom: 10px;
}

#history {
    height: 180px;
    overflow-y: auto;
    background: #0b0b0f;
    border-radius: 8px;
    padding: 10px;
    color: #bbb;
    font-size: 14px;
}

.captured {
    margin-top: 15px;
    color: #bbb;
    min-height: 30px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #aaa;
    text-decoration: none;
}

.back:hover {
    color: white;
}

.promotion {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,0.75);

    display: none;
    align-items: center;
    justify-content: center;

    z-index: 100;
}

.promotion-box {
    background: #15151f;
    border: 1px solid #6c2cff;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
}

.promotion-box h2 {
    margin-top: 0;
}

.promotion-buttons {
    display: flex;
    gap: 10px;
}

.promotion-buttons button {
    font-size: 40px;
    padding: 10px 15px;
}

@media (max-width: 850px) {

    .game-layout {
        flex-direction: column;
        align-items: center;
    }

    .panel {
        width: min(92vw, 560px);
    }

    .header h1 {
        font-size: 34px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>♟️ GameForge Chess</h1>
        <p>Professional 2 Player Chess</p>
    </div>


    <div class="game-layout">

        <div class="left">

            <div id="board"></div>

        </div>


        <div class="panel">

            <div class="turn">
                Turn:
                <strong id="turn">White</strong>
            </div>

            <div class="status" id="status">
                White to move
            </div>

            <div class="buttons">

                <button id="undo">
                    ↩ Undo
                </button>

                <button id="newGame">
                    🔄 New Game
                </button>

            </div>


            <h3 class="history-title">
                Move History
            </h3>

            <div id="history"></div>


            <div class="captured">
                Captured:
                <span id="captured"></span>
            </div>

        </div>

    </div>


    <a class="back" href="games.html">
        ← Back to GameForge Games
    </a>

</div>


<div class="promotion" id="promotion">

    <div class="promotion-box">

        <h2>Choose Promotion</h2>

        <div class="promotion-buttons">

            <button data-piece="q">♕</button>
            <button data-piece="r">♖</button>
            <button data-piece="b">♗</button>
            <button data-piece="n">♘</button>

        </div>

    </div>

</div>


<script>

const boardElement = document.getElementById("board");
const turnElement = document.getElementById("turn");
const statusElement = document.getElementById("status");
const historyElement = document.getElementById("history");
const capturedElement = document.getElementById("captured");

const undoButton = document.getElementById("undo");
const newGameButton = document.getElementById("newGame");

const promotionElement =
    document.getElementById("promotion");


const symbols = {

    w: {
        k: "♔",
        q: "♕",
        r: "♖",
        b: "♗",
        n: "♘",
        p: "♙"
    },

    b: {
        k: "♚",
        q: "♛",
        r: "♜",
        b: "♝",
        n: "♞",
        p: "♟"
    }

};


let board;
let turn;
let selected;
let legalMoves;

let history = [];
let states = [];

let captured = [];

let enPassant = null;

let castling = {
    wk: true,
    wq: true,
    bk: true,
    bq: true
};

let gameOver = false;

let pendingPromotion = null;


/* -----------------------------
   CREATE INITIAL BOARD
----------------------------- */

function createInitialBoard() {

    return [

        [
            {c:"b",t:"r"},
            {c:"b",t:"n"},
            {c:"b",t:"b"},
            {c:"b",t:"q"},
            {c:"b",t:"k"},
            {c:"b",t:"b"},
            {c:"b",t:"n"},
            {c:"b",t:"r"}
        ],

        [
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"},
            {c:"b",t:"p"}
        ],

        [null,null,null,null,null,null,null,null],

        [null,null,null,null,null,null,null,null],

        [null,null,null,null,null,null,null,null],

        [null,null,null,null,null,null,null,null],

        [
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"},
            {c:"w",t:"p"}
        ],

        [
            {c:"w",t:"r"},
            {c:"w",t:"n"},
            {c:"w",t:"b"},
            {c:"w",t:"q"},
            {c:"w",t:"k"},
            {c:"w",t:"b"},
            {c:"w",t:"n"},
            {c:"w",t:"r"}
        ]

    ];
}


/* -----------------------------
   START GAME
----------------------------- */

function newGame() {

    board = createInitialBoard();

    turn = "w";

    selected = null;

    legalMoves = [];

    history = [];

    states = [];

    captured = [];

    enPassant = null;

    castling = {
        wk:true,
        wq:true,
        bk:true,
        bq:true
    };

    gameOver = false;

    pendingPromotion = null;

    render();

    updateStatus();
}


newGame();


/* -----------------------------
   SAVE STATE
----------------------------- */

function cloneBoard(value) {

    return JSON.parse(
        JSON.stringify(value)
    );
}


function saveState() {

    states.push({
        board: cloneBoard(board),
        turn: turn,
        history: [...history],
        captured: [...captured],
        enPassant: enPassant,
        castling: {...castling},
        gameOver: gameOver
    });
}


/* -----------------------------
   RENDER BOARD
----------------------------- */

function render() {

    boardElement.innerHTML = "";

    for (let r = 0; r < 8; r++) {

        for (let c = 0; c < 8; c++) {

            const square =
                document.createElement("button");

            square.className = "square";

            if ((r + c) % 2 === 0) {
                square.classList.add("light");
            } else {
                square.classList.add("dark");
            }


            const piece = board[r][c];


            if (
                selected &&
                selected.r === r &&
                selected.c === c
            ) {

                square.classList.add("selected");
            }


            const move =
                legalMoves.find(
                    m =>
                    m.r === r &&
                    m.c === c
                );


            if (move) {

                if (board[r][c]) {
                    square.classList.add("capture");
                } else {
                    square.classList.add("legal");
                }
            }


            if (
                piece &&
                piece.t === "k" &&
                isSquareAttacked(
                    r,
                    c,
                    opposite(piece.c)
                )
            ) {

                square.classList.add("check");
            }


            if (piece) {

                square.textContent =
                    symbols[piece.c][piece.t];
            }


            square.addEventListener(
                "click",
                () => clickSquare(r,c)
            );


            boardElement.appendChild(square);
        }
    }


    turnElement.textContent =
        turn === "w"
        ? "White"
        : "Black";


    historyElement.innerHTML =
        history.map(
            (move,index) =>
            `<div>${index + 1}. ${move}</div>`
        ).join("");


    capturedElement.textContent =
        captured
        .map(
            p => symbols[p.c][p.t]
        )
        .join(" ");
}


/* -----------------------------
   CLICK SQUARE
----------------------------- */

function clickSquare(r,c) {

    if (gameOver) return;

    if (pendingPromotion) return;


    const piece = board[r][c];


    if (selected) {

        const move =
            legalMoves.find(
                m =>
                m.r === r &&
                m.c === c
            );


        if (move) {

            makeMove(
                selected.r,
                selected.c,
                r,
                c,
                move
            );

            return;
        }


        if (
            piece &&
            piece.c === turn
        ) {

            selectPiece(r,c);

            return;
        }


        selected = null;

        legalMoves = [];

        render();

        return;
    }


    if (
        piece &&
        piece.c === turn
    ) {

        selectPiece(r,c);
    }
}


/* -----------------------------
   SELECT PIECE
----------------------------- */

function selectPiece(r,c) {

    selected = {
        r:r,
        c:c
    };


    legalMoves =
        getLegalMoves(r,c);


    render();
}


/* -----------------------------
   MAKE MOVE
----------------------------- */

function makeMove(fr,fc,tr,tc,move) {

    saveState();


    const piece =
        board[fr][fc];

    const target =
        board[tr][tc];


    let notation =
        piece.t.toUpperCase();


    if (piece.t === "p") {
        notation = "";
    }


    if (target) {

        captured.push(target);

        notation += "x";
    }


    notation +=
        String.fromCharCode(97 + tc) +
        (8 - tr);


    /* En passant capture */

    if (move.enPassant) {

        const capturedPawn =
            board[fr][tc];

        captured.push(capturedPawn);

        board[fr][tc] = null;

        notation += " e.p.";
    }


    /* Move piece */

    board[tr][tc] = piece;

    board[fr][fc] = null;


    /* Castling */

    if (
        piece.t === "k" &&
        Math.abs(tc - fc) === 2
    ) {

        if (tc === 6) {

            board[tr][5] =
                board[tr][7];

            board[tr][7] = null;

        }

        if (tc === 2) {

            board[tr][3] =
                board[tr][0];

            board[tr][0] = null;
        }
    }


    /* Update castling rights */

    updateCastling(
        piece,
        fr,
        fc,
        tr,
        tc
    );


    /* En passant target */

    enPassant = null;


    if (
        piece.t === "p" &&
        Math.abs(tr - fr) === 2
    ) {

        enPassant = {
            r:(fr + tr) / 2,
            c:fc
        };
    }


    /* Promotion */

    if (
        piece.t === "p" &&
        (tr === 0 || tr === 7)
    ) {

        pendingPromotion = {
            r:tr,
            c:tc,
            notation:notation
        };

        promotionElement.style.display =
            "flex";

        selected = null;
        legalMoves = [];

        render();

        return;
    }


    finishMove(notation);
}


/* -----------------------------
   FINISH MOVE
----------------------------- */

function finishMove(notation) {

    history.push(notation);

    selected = null;

    legalMoves = [];

    turn = opposite(turn);

    render();

    updateStatus();
}


/* -----------------------------
   PROMOTION
----------------------------- */

document.querySelectorAll(
    ".promotion-buttons button"
).forEach(button => {

    button.addEventListener(
        "click",
        function() {

            const type =
                this.dataset.piece;

            const color =
                turn;

            board[
                pendingPromotion.r
            ][
                pendingPromotion.c
            ] = {
                c:color,
                t:type
            };


            history.push(
                pendingPromotion.notation +
                "=" +
                type.toUpperCase()
            );


            pendingPromotion = null;

            promotionElement.style.display =
                "none";


            turn = opposite(turn);

            render();

            updateStatus();
        }
    );
});


/* -----------------------------
   GET LEGAL MOVES
----------------------------- */

function getLegalMoves(r,c) {

    const piece =
        board[r][c];

    if (!piece) return [];


    const pseudo =
        getPseudoMoves(r,c);


    return pseudo.filter(
        move => {

            const copy =
                cloneBoard(board);

            const oldEnPassant =
                enPassant;


            simulateMove(
                r,
                c,
                move
            );


            const king =
                findKing(piece.c);


            const safe =
                king &&
                !isSquareAttacked(
                    king.r,
                    king.c,
                    opposite(piece.c)
                );


            board = copy;

            enPassant =
                oldEnPassant;


            return safe;
        }
    );
}


/* -----------------------------
   PSEUDO MOVES
----------------------------- */

function getPseudoMoves(r,c) {

    const piece =
        board[r][c];

    const moves = [];


    if (!piece) return moves;


    if (piece.t === "p") {

        const dir =
            piece.c === "w"
            ? -1
            : 1;

        const start =
            piece.c === "w"
            ? 6
            : 1;


        const one =
            r + dir;


        if (
            inside(one,c) &&
            !board[one][c]
        ) {

            moves.push({
                r:one,
                c:c
            });


            const two =
                r + dir * 2;


            if (
                r === start &&
                !board[two][c]
            ) {

                moves.push({
                    r:two,
                    c:c
                });
            }
        }


        for (
            const dc of [-1,1]
        ) {

            const nr = r + dir;
            const nc = c + dc;


            if (!inside(nr,nc))
                continue;


            const target =
                board[nr][nc];


            if (
                target &&
                target.c !== piece.c
            ) {

                moves.push({
                    r:nr,
                    c:nc
                });
            }


            /* En passant */

            if (
                enPassant &&
                enPassant.r === nr &&
                enPassant.c === nc
            ) {

                moves.push({
                    r:nr,
                    c:nc,
                    enPassant:true
                });
            }
        }
    }


    if (piece.t === "n") {

        const jumps = [

            [-2,-1],
            [-2,1],
            [-1,-2],
            [-1,2],
            [1,-2],
            [1,2],
            [2,-1],
            [2,1]

        ];


        jumps.forEach(
            ([dr,dc]) => {

                const nr =
                    r + dr;

                const nc =
                    c + dc;


                if (!inside(nr,nc))
                    return;


                if (
                    !board[nr][nc] ||
                    board[nr][nc].c !== piece.c
                ) {

                    moves.push({
                        r:nr,
                        c:nc
                    });
                }
            }
        );
    }


    if (
        piece.t === "b" ||
        piece.t === "r" ||
        piece.t === "q"
    ) {

        let directions = [];


        if (
            piece.t === "b" ||
            piece.t === "q"
        ) {

            directions.push(
                [-1,-1],
                [-1,1],
                [1,-1],
                [1,1]
            );
        }


        if (
            piece.t === "r" ||
            piece.t === "q"
        ) {

            directions.push(
                [-1,0],
                [1,0],
                [0,-1],
                [0,1]
            );
        }


        directions.forEach(
            ([dr,dc]) => {

                let nr = r + dr;
                let nc = c + dc;


                while (
                    inside(nr,nc)
                ) {

                    if (!board[nr][nc]) {

                        moves.push({
                            r:nr,
                            c:nc
                        });

                    } else {

                        if (
                            board[nr][nc].c !==
                            piece.c
                        ) {

                            moves.push({
                                r:nr,
                                c:nc
                            });
                        }

                        break;
                    }


                    nr += dr;
                    nc += dc;
                }
            }
        );
    }


    if (piece.t === "k") {

        for (
            let dr = -1;
            dr <= 1;
            dr++
        ) {

            for (
                let dc = -1;
                dc <= 1;
                dc++
            ) {

                if (
                    dr === 0 &&
                    dc === 0
                )
                    continue;


                const nr = r + dr;
                const nc = c + dc;


                if (!inside(nr,nc))
                    continue;


                if (
                    !board[nr][nc] ||
                    board[nr][nc].c !== piece.c
                ) {

                    moves.push({
                        r:nr,
                        c:nc
                    });
                }
            }
        }


        /* Castling */

        if (
            !isSquareAttacked(
                r,
                c,
                opposite(piece.c)
            )
        ) {

            if (
                piece.c === "w" &&
                castling.wk &&
                !board[7][5] &&
                !board[7][6] &&
                !isSquareAttacked(
                    7,
                    5,
                    "b"
                ) &&
                !isSquareAttacked(
                    7,
                    6,
                    "b"
                )
            ) {

                moves.push({
                    r:7,
                    c:6,
                    castle:"king"
                });
            }


            if (
                piece.c === "w" &&
                castling.wq &&
                !board[7][1] &&
                !board[7][2] &&
                !board[7][3] &&
                !isSquareAttacked(
                    7,
                    3,
                    "b"
                ) &&
                !isSquareAttacked(
                    7,
                    2,
                    "b"
                )
            ) {

                moves.push({
                    r:7,
                    c:2,
                    castle:"queen"
                });
            }


            if (
                piece.c === "b" &&
                castling.bk &&
                !board[0][5] &&
                !board[0][6] &&
                !isSquareAttacked(
                    0,
                    5,
                    "w"
                ) &&
                !isSquareAttacked(
                    0,
                    6,
                    "w"
                )
            ) {

                moves.push({
                    r:0,
                    c:6,
                    castle:"king"
                });
            }


            if (
                piece.c === "b" &&
                castling.bq &&
                !board[0][1] &&
                !board[0][2] &&
                !board[0][3] &&
                !isSquareAttacked(
                    0,
                    3,
                    "w"
                ) &&
                !isSquareAttacked(
                    0,
                    2,
                    "w"
                )
            ) {

                moves.push({
                    r:0,
                    c:2,
                    castle:"queen"
                });
            }
        }
    }


    return moves;
}


/* -----------------------------
   SIMULATE MOVE
----------------------------- */

function simulateMove(fr,fc,move) {

    const piece =
        board[fr][fc];


    board[move.r][move.c] =
        piece;

    board[fr][fc] = null;


    if (move.enPassant) {

        board[fr][move.c] = null;
    }


    if (
        move.castle &&
        piece.t === "k"
    ) {

        if (move.c === 6) {

            board[fr][5] =
                board[fr][7];

            board[fr][7] = null;

        } else {

            board[fr][3] =
                board[fr][0];

            board[fr][0] = null;
        }
    }
}


/* -----------------------------
   ATTACK CHECK
----------------------------- */

function isSquareAttacked(
    r,
    c,
    byColor
) {

    for (
        let fr = 0;
        fr < 8;
        fr++
    ) {

        for (
            let fc = 0;
            fc < 8;
            fc++
        ) {

            const piece =
                board[fr][fc];


            if (
                !piece ||
                piece.c !== byColor
            )
                continue;


            if (
                attacksSquare(
                    fr,
                    fc,
                    r,
                    c,
                    piece
                )
            ) {

                return true;
            }
        }
    }


    return false;
}


/* -----------------------------
   ATTACKS SQUARE
----------------------------- */

function attacksSquare(
    fr,
    fc,
    tr,
    tc,
    piece
) {

    const dr = tr - fr;
    const dc = tc - fc;

    const ar = Math.abs(dr);
    const ac = Math.abs(dc);


    if (piece.t === "p") {

        const dir =
            piece.c === "w"
            ? -1
            : 1;

        return (
            dr === dir &&
            ac === 1
        );
    }


    if (piece.t === "n") {

        return (
            (ar === 2 && ac === 1) ||
            (ar === 1 && ac === 2)
        );
    }


    if (piece.t === "k") {

        return (
            ar <= 1 &&
            ac <= 1
        );
    }


    if (piece.t === "b") {

        return (
            ar === ac &&
            clearPath(
                fr,fc,tr,tc
            )
        );
    }


    if (piece.t === "r") {

        return (
            (dr === 0 || dc === 0) &&
            clearPath(
                fr,fc,tr,tc
            )
        );
    }


    if (piece.t === "q") {

        return (
            (
                dr === 0 ||
                dc === 0 ||
                ar === ac
            ) &&
            clearPath(
                fr,fc,tr,tc
            )
        );
    }


    return false;
}


/* -----------------------------
   CLEAR PATH
----------------------------- */

function clearPath(
    fr,fc,tr,tc
) {

    const sr =
        Math.sign(tr - fr);

    const sc =
        Math.sign(tc - fc);


    let r =
        fr + sr;

    let c =
        fc + sc;


    while (
        r !== tr ||
        c !== tc
    ) {

        if (board[r][c]) {
            return false;
        }

        r += sr;
        c += sc;
    }


    return true;
}


/* -----------------------------
   FIND KING
----------------------------- */

function findKing(color) {

    for (
        let r = 0;
        r < 8;
        r++
    ) {

        for (
            let c = 0;
            c < 8;
            c++
        ) {

            const piece =
                board[r][c];


            if (
                piece &&
                piece.c === color &&
                piece.t === "k"
            ) {

                return {
                    r:r,
                    c:c
                };
            }
        }
    }


    return null;
}


/* -----------------------------
   OPPOSITE
----------------------------- */

function opposite(color) {

    return color === "w"
        ? "b"
        : "w";
}


/* -----------------------------
   INSIDE BOARD
----------------------------- */

function inside(r,c) {

    return (
        r >= 0 &&
        r < 8 &&
        c >= 0 &&
        c < 8
    );
}


/* -----------------------------
   CASTLING RIGHTS
----------------------------- */

function updateCastling(
    piece,
    fr,
    fc,
    tr,
    tc
) {

    if (piece.t === "k") {

        if (piece.c === "w") {

            castling.wk = false;
            castling.wq = false;

        } else {

            castling.bk = false;
            castling.bq = false;
        }
    }


    if (piece.t === "r") {

        if (
            piece.c === "w" &&
            fr === 7 &&
            fc === 0
        ) {
            castling.wq = false;
        }


        if (
            piece.c === "w" &&
            fr === 7 &&
            fc === 7
        ) {
            castling.wk = false;
        }


        if (
            piece.c === "b" &&
            fr === 0 &&
            fc === 0
        ) {
            castling.bq = false;
        }


        if (
            piece.c === "b" &&
            fr === 0 &&
            fc === 7
        ) {
            castling.bk = false;
        }
    }
}


/* -----------------------------
   STATUS
----------------------------- */

function updateStatus() {

    const king =
        findKing(turn);


    if (
        !king
    ) {

        gameOver = true;

        statusElement.textContent =
            "🏆 " +
            (turn === "w"
                ? "Black"
                : "White") +
            " wins!";

        return;
    }


    const inCheck =
        isSquareAttacked(
            king.r,
            king.c,
            opposite(turn)
        );


    let hasMove = false;


    for (
        let r = 0;
        r < 8 &&
        !hasMove;
        r++
    ) {

        for (
            let c = 0;
            c < 8 &&
            !hasMove;
            c++
        ) {

            const piece =
                board[r][c];


            if (
                piece &&
                piece.c === turn &&
                getLegalMoves(r,c).length
            ) {

                hasMove = true;
            }
        }
    }


    if (!hasMove) {

        gameOver = true;


        if (inCheck) {

            statusElement.textContent =
                "♚ CHECKMATE! " +
                (turn === "w"
                    ? "Black"
                    : "White") +
                " wins!";

        } else {

            statusElement.textContent =
                "🤝 STALEMATE! Draw.";
        }

        return;
    }


    if (inCheck) {

        statusElement.textContent =
            "⚠️ " +
            (turn === "w"
                ? "White"
                : "Black") +
            " is in CHECK!";

    } else {

        statusElement.textContent =
            (turn === "w"
                ? "White"
                : "Black") +
            " to move";
    }
}


/* -----------------------------
   UNDO
----------------------------- */

undoButton.addEventListener(
    "click",
    function() {

        if (!states.length)
            return;


        const state =
            states.pop();


        board =
            cloneBoard(state.board);

        turn =
            state.turn;

        history =
            [...state.history];

        captured =
            [...state.captured];

        enPassant =
            state.enPassant;

        castling =
            {...state.castling};

        gameOver =
            state.gameOver;


        selected = null;

        legalMoves = [];


        render();

        updateStatus();
    }
);


/* -----------------------------
   NEW GAME
----------------------------- */

newGameButton.addEventListener(
    "click",
    newGame
);

</script>
